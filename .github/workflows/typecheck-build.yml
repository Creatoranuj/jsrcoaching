name: Typecheck & Build

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: typecheck-build-${{ github.ref }}
  cancel-in-progress: true

# Least-privilege GITHUB_TOKEN (audit 2026-09-23): the default repo token is
# write-all; every job here only reads the checkout.
permissions:
  contents: read

jobs:
  typecheck-build:
    name: Typecheck & Production Build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Production build (with bundle-size guard)
        run: bun run build
