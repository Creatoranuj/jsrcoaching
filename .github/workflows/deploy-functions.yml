name: Deploy Supabase Edge Functions

on:
  push:
    branches: [main]
    paths:
      - 'supabase/functions/**'
      - 'supabase/config.toml'
      - '.github/workflows/deploy-functions.yml'
  workflow_dispatch:

concurrency:
  group: deploy-functions
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF || 'wegamscqtvqhxowlskfm' }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
    steps:
      - uses: actions/checkout@v4

      - name: Require access token
        run: |
          if [ -z "${SUPABASE_ACCESS_TOKEN}" ]; then
            echo "::error::SUPABASE_ACCESS_TOKEN repo secret is missing. Add it in Settings > Secrets > Actions."
            exit 1
          fi

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Deploy all functions
        run: |
          set -e
          for dir in supabase/functions/*/; do
            name="$(basename "$dir")"
            case "$name" in _*) continue;; esac
            echo "--- deploying $name"
            supabase functions deploy "$name" --project-ref "$SUPABASE_PROJECT_REF"
          done

      - name: Post-deploy live health gate
        if: env.SUPABASE_ANON_KEY != ''
        run: |
          chmod +x scripts/verify-live-functions.sh
          SKIP_OTP=1 ./scripts/verify-live-functions.sh

      - name: Warn when health gate is skipped
        if: env.SUPABASE_ANON_KEY == ''
        run: echo "::warning::SUPABASE_ANON_KEY secret not set — post-deploy health gate skipped."
