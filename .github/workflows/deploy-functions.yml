name: Deploy Supabase Edge Functions

on:
  push:
    branches: [main]
    paths:
      - 'supabase/functions/**'
      - 'supabase/config.toml'
      - '.github/workflows/deploy-functions.yml'
  workflow_dispatch:

concurrency:
  group: deploy-functions
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF || 'wegamscqtvqhxowlskfm' }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY || secrets.VITE_SUPABASE_ANON_KEY || secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
      LOVABLE_API_KEY: ${{ secrets.LOVABLE_API_KEY }}
    steps:
      - uses: actions/checkout@v5

      # No token configured is a *configuration* state, not a code failure:
      # skip cleanly instead of painting the pipeline red.
      - name: Check publish token
        id: gate
        run: |
          if [ -z "${SUPABASE_ACCESS_TOKEN}" ]; then
            echo "::warning::SUPABASE_ACCESS_TOKEN repo secret is missing — skipping function deploy. Add it in Settings > Secrets > Actions to enable publishing."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: supabase/setup-cli@v1
        if: steps.gate.outputs.ready == 'true'
        with:
          version: latest

      # Keep the AI gateway key in the edge-function runtime in sync with the
      # repo secret; a stale key makes chatbot/resolve-doubt/ai-health 401.
      - name: Sync LOVABLE_API_KEY into function secrets
        if: steps.gate.outputs.ready == 'true' && env.LOVABLE_API_KEY != ''
        run: |
          supabase secrets set LOVABLE_API_KEY="$LOVABLE_API_KEY" --project-ref "$SUPABASE_PROJECT_REF"

      - name: Deploy all functions
        if: steps.gate.outputs.ready == 'true'
        run: |
          set -e
          for dir in supabase/functions/*/; do
            name="$(basename "$dir")"
            case "$name" in _*) continue;; esac
            echo "--- deploying $name"
            supabase functions deploy "$name" --project-ref "$SUPABASE_PROJECT_REF"
          done

      - name: Post-deploy live health gate
        if: steps.gate.outputs.ready == 'true' && env.SUPABASE_ANON_KEY != ''
        run: |
          chmod +x scripts/verify-live-functions.sh
          SKIP_OTP=1 ./scripts/verify-live-functions.sh

      - name: Warn when health gate is skipped
        if: steps.gate.outputs.ready == 'true' && env.SUPABASE_ANON_KEY == ''
        run: echo "::warning::SUPABASE_ANON_KEY secret not set — post-deploy health gate skipped."
