name: Deploy Edge Functions

# Keeps the live Supabase Edge Functions in sync with `main`.
# Before this existed, functions were deployed by hand, so `main` could carry a
# fix (e.g. the CORS allow-list rebrand) while production still ran the old
# code and every checkout failed with "Failed to send a request to the Edge
# Function". Deployment is now automatic + verified.

on:
  push:
    branches: [main]
    paths:
      - 'supabase/functions/**'
      - 'supabase/config.toml'
      - '.github/workflows/deploy-functions.yml'
  workflow_dispatch:

concurrency:
  group: deploy-edge-functions
  cancel-in-progress: false

env:
  SUPABASE_PROJECT_REF: wegamscqtvqhxowlskfm
  LIVE_ORIGIN: https://jsrcoaching.vercel.app
  DISALLOWED_ORIGIN: https://not-our-site.example.com

jobs:
  deploy:
    name: Deploy and verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Fail fast when the access token is missing
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -e
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::SUPABASE_ACCESS_TOKEN repository secret is not set. Add it in Settings > Secrets and variables > Actions."
            exit 1
          fi

      - name: Deploy all edge functions
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -e
          supabase functions deploy --project-ref "$SUPABASE_PROJECT_REF"

      - name: Verify live CORS allow-list (post-deploy gate)
        run: |
          set -e
          BASE="https://${SUPABASE_PROJECT_REF}.supabase.co/functions/v1"
          FN="create-razorpay-order"

          echo "Preflight from allowed origin: $LIVE_ORIGIN"
          ALLOWED_HEADERS=$(curl -sS -i -X OPTIONS "$BASE/$FN" \
            -H "Origin: $LIVE_ORIGIN" \
            -H "Access-Control-Request-Method: POST" \
            -H "Access-Control-Request-Headers: authorization, content-type, apikey")
          echo "$ALLOWED_HEADERS"
          ECHOED=$(printf '%s' "$ALLOWED_HEADERS" | tr -d '\r' | awk 'tolower($1) == "access-control-allow-origin:" { print $2 }' | head -n1)
          if [ "$ECHOED" != "$LIVE_ORIGIN" ]; then
            echo "::error::Live function allows '$ECHOED' but the site runs on '$LIVE_ORIGIN'. Deployment is out of sync with the repository."
            exit 1
          fi

          echo "Preflight from a disallowed origin: $DISALLOWED_ORIGIN"
          DENIED_HEADERS=$(curl -sS -i -X OPTIONS "$BASE/$FN" \
            -H "Origin: $DISALLOWED_ORIGIN" \
            -H "Access-Control-Request-Method: POST")
          echo "$DENIED_HEADERS"
          DENIED_ECHO=$(printf '%s' "$DENIED_HEADERS" | tr -d '\r' | awk 'tolower($1) == "access-control-allow-origin:" { print $2 }' | head -n1)
          if [ "$DENIED_ECHO" = "$DISALLOWED_ORIGIN" ] || [ "$DENIED_ECHO" = "*" ]; then
            echo "::error::Unknown origin '$DISALLOWED_ORIGIN' was allowed ('$DENIED_ECHO'). The CORS allow-list is too permissive."
            exit 1
          fi

          echo "CORS allow-list verified against the live deployment."
