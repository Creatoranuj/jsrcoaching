name: Enrollment Bypass Regression

on:
  push:
    branches: [main]
    paths:
      - 'src/test/enrollment-bypass.integration.test.ts'
      - 'src/hooks/useEnrollments.ts'
      - 'supabase/migrations/**'
  pull_request:
    paths:
      - 'src/test/enrollment-bypass.integration.test.ts'
      - 'src/hooks/useEnrollments.ts'
      - 'supabase/migrations/**'
  schedule:
    # Daily 03:15 UTC red-team probe
    - cron: '15 3 * * *'
  workflow_dispatch:

# Least-privilege GITHUB_TOKEN (audit 2026-09-23): the default repo token is
# write-all; every job here only reads the checkout.
permissions:
  contents: read

jobs:
  bypass-probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      # Missing test-student credentials is a configuration state, not a code
      # failure: skip cleanly instead of painting the pipeline red.
      - name: Check required secrets
        id: gate
        env:
          TEST_USER_EMAIL: ${{ secrets.TEST_USER_EMAIL }}
          TEST_USER_PASSWORD: ${{ secrets.TEST_USER_PASSWORD }}
          TEST_PAID_COURSE_ID: ${{ secrets.TEST_PAID_COURSE_ID }}
          SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          ANON_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
          ANON_FALLBACK: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$TEST_USER_EMAIL" ] || [ -z "$TEST_USER_PASSWORD" ] || [ -z "$TEST_PAID_COURSE_ID" ]; then
            echo "::warning::TEST_USER_EMAIL / TEST_USER_PASSWORD / TEST_PAID_COURSE_ID not configured — skipping the enrollment-bypass probe."
            echo "ready=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          KEY="${ANON_KEY:-$ANON_FALLBACK}"
          if [ -z "${SUPABASE_URL:-}" ] || [ -z "$KEY" ]; then
            echo "::warning::VITE_SUPABASE_URL / publishable key not configured — skipping the enrollment-bypass probe."
            echo "ready=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # The probe is only meaningful when the test student can actually sign
          # in. Bad/rotated credentials are a configuration state, so warn and
          # skip rather than paint the pipeline red for a non-code problem.
          # Run #114 died here: the auth endpoint answered with a non-JSON
          # body (gateway error page) and `jq -r` aborted the step, painting a
          # configuration/infra problem red. Capture status + body separately,
          # parse defensively and downgrade every non-2xx to a clean skip.
          AUTH_BODY=$(mktemp)
          AUTH_CODE=$(curl -s -o "$AUTH_BODY" -w '%{http_code}' --max-time 30 \
            -X POST "$SUPABASE_URL/auth/v1/token?grant_type=password" \
            -H "apikey: $KEY" -H 'Content-Type: application/json' \
            --data "$(jq -nc --arg e "$TEST_USER_EMAIL" --arg p "$TEST_USER_PASSWORD" '{email:$e,password:$p}')" \
            || echo 000)
          TOKEN=""
          if [ "$AUTH_CODE" = "200" ] && jq -e . "$AUTH_BODY" >/dev/null 2>&1; then
            TOKEN=$(jq -r '.access_token // empty' "$AUTH_BODY")
          fi
          if [ -n "$TOKEN" ]; then
            # Never let a live JWT reach the log, not even truncated.
            echo "::add-mask::$TOKEN"
          fi
          rm -f "$AUTH_BODY"
          if [ -z "$TOKEN" ]; then
            echo "::warning::Test-student sign-in failed (HTTP $AUTH_CODE — invalid credentials, rotated password or auth outage) — skipping the enrollment-bypass probe. Update TEST_USER_EMAIL / TEST_USER_PASSWORD in Settings > Secrets > Actions to re-enable it."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "Test-student sign-in OK."
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v5
        if: steps.gate.outputs.ready == 'true'

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        if: steps.gate.outputs.ready == 'true'
        with:
          bun-version: '1.2.18'

      - name: Install deps
        if: steps.gate.outputs.ready == 'true'
        run: bun install --frozen-lockfile

      - name: Run enrollment-bypass integration test
        if: steps.gate.outputs.ready == 'true'
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
          TEST_USER_EMAIL: ${{ secrets.TEST_USER_EMAIL }}
          TEST_USER_PASSWORD: ${{ secrets.TEST_USER_PASSWORD }}
          TEST_PAID_COURSE_ID: ${{ secrets.TEST_PAID_COURSE_ID }}
        run: |
          bunx vitest run src/test/enrollment-bypass.integration.test.ts --reporter=verbose
