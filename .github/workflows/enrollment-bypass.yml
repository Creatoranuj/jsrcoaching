name: Enrollment Bypass Regression

on:
  push:
    branches: [main]
    paths:
      - 'src/test/enrollment-bypass.integration.test.ts'
      - 'src/hooks/useEnrollments.ts'
      - 'supabase/migrations/**'
  pull_request:
    paths:
      - 'src/test/enrollment-bypass.integration.test.ts'
      - 'src/hooks/useEnrollments.ts'
      - 'supabase/migrations/**'
  schedule:
    # Daily 03:15 UTC red-team probe
    - cron: '15 3 * * *'
  workflow_dispatch:

jobs:
  bypass-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      # Missing test-student credentials is a configuration state, not a code
      # failure: skip cleanly instead of painting the pipeline red.
      - name: Check required secrets
        id: gate
        env:
          TEST_USER_EMAIL: ${{ secrets.TEST_USER_EMAIL }}
          TEST_USER_PASSWORD: ${{ secrets.TEST_USER_PASSWORD }}
          TEST_PAID_COURSE_ID: ${{ secrets.TEST_PAID_COURSE_ID }}
        run: |
          if [ -z "$TEST_USER_EMAIL" ] || [ -z "$TEST_USER_PASSWORD" ] || [ -z "$TEST_PAID_COURSE_ID" ]; then
            echo "::warning::TEST_USER_EMAIL / TEST_USER_PASSWORD / TEST_PAID_COURSE_ID not configured — skipping the enrollment-bypass probe."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v5
        if: steps.gate.outputs.ready == 'true'

      - uses: oven-sh/setup-bun@v2
        if: steps.gate.outputs.ready == 'true'
        with:
          bun-version: latest

      - name: Install deps
        if: steps.gate.outputs.ready == 'true'
        run: bun install --frozen-lockfile

      - name: Run enrollment-bypass integration test
        if: steps.gate.outputs.ready == 'true'
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
          TEST_USER_EMAIL: ${{ secrets.TEST_USER_EMAIL }}
          TEST_USER_PASSWORD: ${{ secrets.TEST_USER_PASSWORD }}
          TEST_PAID_COURSE_ID: ${{ secrets.TEST_PAID_COURSE_ID }}
        run: |
          bunx vitest run src/test/enrollment-bypass.integration.test.ts --reporter=verbose
