name: Code Guards

# Cheap grep-based ceilings that fail CI when NEW hardcoded colors or raw
# console.* calls are added above the snapshot budget. Ratchet down by
# lowering the BUDGET constant in each script after cleanup PRs land.

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'bun.lock'
      - 'bun.lockb'
      - 'package-lock.json'
      - 'package.json'
      - 'scripts/check-design-tokens.mjs'
      - 'scripts/check-console-usage.mjs'
      - 'scripts/check-tap-targets.mjs'
      - 'scripts/check-lockfile-registry.mjs'
      - 'scripts/check-realtime-cleanup.mjs'
      - '.github/workflows/code-guards.yml'
  pull_request:
    paths:
      - 'src/**'
      - 'bun.lock'
      - 'bun.lockb'
      - 'package-lock.json'
      - 'package.json'
      - 'scripts/check-design-tokens.mjs'
      - 'scripts/check-console-usage.mjs'
      - 'scripts/check-tap-targets.mjs'
      - 'scripts/check-lockfile-registry.mjs'
      - 'scripts/check-realtime-cleanup.mjs'
  workflow_dispatch:

concurrency:
  group: code-guards-${{ github.ref }}
  cancel-in-progress: true

# Least-privilege GITHUB_TOKEN (audit 2026-09-23): the default repo token is
# write-all; every job here only reads the checkout.
permissions:
  contents: read

jobs:
  guards:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Install ripgrep
        # Pinned static binary (sha256-verified) is ~10x faster than apt-get
        # update + install; falls back to apt if the download fails.
        run: |
          set -e
          URL=https://github.com/BurntSushi/ripgrep/releases/download/14.1.1/ripgrep-14.1.1-x86_64-unknown-linux-musl.tar.gz
          SHA=4cf9f2741e6c465ffdb7c26f38056a59e2a2544b51f7cc128ef28337eeae4d8e
          if curl -fsSL --max-time 30 "$URL" -o /tmp/rg.tgz && echo "$SHA  /tmp/rg.tgz" | sha256sum -c -; then
            tar xzf /tmp/rg.tgz -C /tmp
            sudo install /tmp/ripgrep-14.1.1-x86_64-unknown-linux-musl/rg /usr/local/bin/rg
          else
            sudo apt-get update && sudo apt-get install -y ripgrep
          fi
          rg --version

      # Runs before anything expensive: a lockfile pinned to a sandbox-private
      # registry (Replit / Lovable mirror) makes every downstream CI install
      # fail with ConnectionRefused / EAI_AGAIN. Catch it at PR time, not at
      # release-tag time.
      - name: Lockfile registry guard
        run: |
          node scripts/check-lockfile-registry.mjs || {
            echo "::error::Lockfile pins sandbox-private registry tarballs. Remedy: run 'bun run fix:lockfile' locally and commit bun.lock + package-lock.json." >&2
            exit 1
          }

      - name: Design-token ceiling
        run: node scripts/check-design-tokens.mjs

      - name: Console-usage ceiling
        run: node scripts/check-console-usage.mjs

      - name: Tap-target ceiling
        run: node scripts/check-tap-targets.mjs

      - name: Realtime cleanup guard
        run: node scripts/check-realtime-cleanup.mjs

