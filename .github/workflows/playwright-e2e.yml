name: Playwright E2E

# Browser-based end-to-end smoke tests using Playwright + Chromium.
# Runs against a locally-served Vite preview build so it doesn't depend on
# any deployed environment. Uploads the HTML report + traces on failure.
#
# Requires GitHub repo secrets (already configured):
#   E2E_EMAIL, E2E_PASSWORD, TEST_USER_EMAIL, TEST_USER_PASSWORD

on:
  push:
    branches: [main]
    paths:
      - 'e2e/**'
      - 'src/**'
      - 'playwright.config.ts'
      - '.github/workflows/playwright-e2e.yml'
  pull_request:
    paths:
      - 'e2e/**'
      - 'src/**'
      - 'playwright.config.ts'
  workflow_dispatch:

concurrency:
  group: playwright-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - uses: actions/setup-node@v5
        with:
          node-version: '24'

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.2.18'

      # Cache node_modules directly (keyed on lockfile) — skips `bun install`
      # entirely on warm runs. Mirrors the fast-path used in build-apk.yml.
      - name: 🗂️ Cache node_modules
        id: cache-node-modules
        uses: actions/cache@v5
        with:
          path: node_modules
          key: ${{ runner.os }}-node-modules-bun-${{ hashFiles('bun.lock', 'bun.lockb', 'package.json') }}

      - name: 📦 Install deps
        if: steps.cache-node-modules.outputs.cache-hit != 'true'
        run: bun install --frozen-lockfile --ignore-scripts

      - name: 🔎 Verify Playwright dependency is declared
        run: |
          node -e "const fs=require('fs'); const p=JSON.parse(fs.readFileSync('./package.json', 'utf8')); if (!p.devDependencies?.['@playwright/test']) { console.error('::error::@playwright/test is missing from devDependencies'); process.exit(1) }"

      # Also resolves quiz / lesson fixtures as the E2E student and exports
      # them via $GITHUB_ENV (E2E_QUIZ_ID_RESOLVED, E2E_LESSON_ID_RESOLVED).
      - name: 🔐 Verify E2E account, courses + resolve fixtures
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
          E2E_EMAIL: ${{ secrets.E2E_EMAIL }}
          E2E_PASSWORD: ${{ secrets.E2E_PASSWORD }}
          E2E_COURSE_ID: ${{ secrets.E2E_COURSE_ID }}
          E2E_PAID_COURSE_ID: ${{ secrets.E2E_PAID_COURSE_ID }}
          TEST_PAID_COURSE_ID: ${{ secrets.TEST_PAID_COURSE_ID }}
          E2E_QUIZ_ID: ${{ secrets.E2E_QUIZ_ID }}
          E2E_LESSON_ID: ${{ secrets.E2E_LESSON_ID }}
        run: node .github/scripts/e2e-preflight.mjs

      # Cache Playwright's browser download (~180MB) between runs.
      - name: 🗂️ Cache Playwright browsers
        id: cache-playwright
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('bun.lock', 'bun.lockb') }}

      - name: 🎭 Install Playwright browsers (chromium only)
        run: bunx playwright install --with-deps chromium


      - name: 🏗️ Build web app
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: bun run build

      # No manual preview server here: playwright.config.ts `webServer` owns
      # :8080 and `reuseExistingServer` is false on CI, so starting a second
      # one made every run die with "http://localhost:8080 is already used".

      - name: 🧪 Run Playwright (desktop Chromium + Pixel 7 emulation)
        env:
          CI: 'true'
          BASE_URL: 'http://localhost:8080'
          E2E_EMAIL: ${{ secrets.E2E_EMAIL }}
          E2E_PASSWORD: ${{ secrets.E2E_PASSWORD }}
          TEST_USER_EMAIL: ${{ secrets.TEST_USER_EMAIL }}
          TEST_USER_PASSWORD: ${{ secrets.TEST_USER_PASSWORD }}
          TEST_PAID_COURSE_ID: ${{ secrets.TEST_PAID_COURSE_ID }}
          # Learning-journey legs; unset => those legs skip cleanly (never red).
          E2E_COURSE_ID: ${{ secrets.E2E_COURSE_ID }}
          E2E_PAID_COURSE_ID: ${{ secrets.E2E_PAID_COURSE_ID || secrets.TEST_PAID_COURSE_ID }}
          # Preflight resolves these *as the E2E student* (RLS-visible, has
          # questions / has an image comment); the raw secret is only a fallback.
          E2E_QUIZ_ID: ${{ env.E2E_QUIZ_ID_RESOLVED || secrets.E2E_QUIZ_ID }}
          E2E_LESSON_ID: ${{ env.E2E_LESSON_ID_RESOLVED }}
          E2E_LESSON_COURSE_ID: ${{ env.E2E_LESSON_COURSE_ID_RESOLVED }}
          # RLS specs (profiles-pii, receipts bucket) talk to Supabase directly
          # with the anon key + a student session. Same values as the app build.
          E2E_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          E2E_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
          E2E_STUDENT_EMAIL: ${{ secrets.E2E_STUDENT_EMAIL || secrets.E2E_EMAIL }}
          E2E_STUDENT_PASSWORD: ${{ secrets.E2E_STUDENT_PASSWORD || secrets.E2E_PASSWORD }}
          E2E_TEST_USER_EMAIL: ${{ secrets.TEST_USER_EMAIL }}
          E2E_TEST_USER_PASSWORD: ${{ secrets.TEST_USER_PASSWORD }}
          # Admin specs (admin.spec, refund-journey, payment review, chatbot
          # prompt-injection) run as soon as a dedicated admin test account is
          # added as repo secrets; until then they skip with a clear reason.
          E2E_ADMIN_EMAIL: ${{ secrets.E2E_ADMIN_EMAIL }}
          E2E_ADMIN_PASSWORD: ${{ secrets.E2E_ADMIN_PASSWORD }}
          E2E_ENROLLED_COURSE_ID: ${{ secrets.E2E_COURSE_ID }}
        # Hard gate: a green run must mean green tests. The old `|| warning`
        # swallowed real failures and reported success. Report + traces are
        # still uploaded by the always() step below.
        # No --reporter flag: a CLI reporter list overrides the config and the
        # json reporter then writes to stdout instead of
        # test-results/results.json, which left the failure-summary step with
        # nothing to read. Reporters live in playwright.config.ts.
        # `android-pixel7` is Chromium with Pixel 7 emulation (touch, DPR,
        # 412x915, mobile UA) — no extra browser download. Its testMatch in
        # playwright.config.ts limits it to the student-facing mobile specs.
        run: bunx playwright test --project=chromium --project=android-pixel7

      # Failed test names + first error lines as plain text (job log annotations
      # + step summary), so diagnosing a red run never needs the artifact zip.
      - name: 🧾 Failed test summary (plain text)
        if: always()
        run: node .github/scripts/e2e-failure-summary.mjs test-results/results.json

      - name: 📤 Upload Playwright report (always)
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14
          if-no-files-found: ignore
