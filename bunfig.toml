# Bun install configuration.
#
# The registry pin mirrors .npmrc: sandboxes (Replit / Lovable) proxy npm
# through private hosts and bake those absolute tarball URLs into bun.lock.
# Those hosts are unreachable from GitHub Actions runners, which surfaces as
# `ConnectionRefused` / `FailedToOpenSocket` on the same handful of packages
# on every retry. Keep this pinned to the public registry.
[install]
registry = "https://registry.npmjs.org"
