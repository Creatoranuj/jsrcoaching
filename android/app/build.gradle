apply plugin: 'com.android.application'

android {
    namespace = "com.jsrcoaching.app"
    compileSdk = rootProject.ext.compileSdkVersion
    // Silences the AGP 9 deprecation: "android.defaults.buildfeatures.buildconfig=true".
    // We don't use BuildConfig fields in app code; flipping to false also
    // skips a small AGP task per variant.
    buildFeatures {
        buildConfig = false
    }
    defaultConfig {
        applicationId "com.jsrcoaching.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        def ciRunNumber = System.getenv("GITHUB_RUN_NUMBER")
        versionCode ciRunNumber ? ciRunNumber.toInteger() : 1
        // versionName MUST be numeric (e.g. "1.0.0") because ForceUpdateGate
        // compares it against app_config.min_android_version segment-by-segment.
        // Previously this used GITHUB_REF_NAME which is "main" on workflow_dispatch
        // → parsed to [0] → triggered the "Update Required" popup on every build.
        // Prefer APP_VERSION_NAME injected by the workflow; fall back to "1.0.0".
        def rawVersion = System.getenv("APP_VERSION_NAME") ?: "1.0.0"
        // Strip any non-numeric prefix/suffix (e.g. "v1.0-20260615-1234" → "1.0")
        def numericVersion = (rawVersion =~ /\d+(\.\d+)*/) ? (rawVersion =~ /\d+(\.\d+)*/)[0][0] : "1.0.0"
        versionName numericVersion
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
            // Strip build artefacts that must never ship inside the APK/AAB:
            //  - *.map  → 331 sourcemaps (~28 MB) from dist/ AND from the
            //    ionfileviewer-android AAR's bundled pdf.js. They leak full
            //    source and bloat the package; Sentry uses the uploaded copies.
            //  - compressed.tracemonkey-pldi-09.pdf → pdf.js demo document (1 MB).
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~:!*.map:!compressed.tracemonkey-pldi-09.pdf'
        }
        // Ship only ARM native libs — x86/x86_64 cuts ~12-18 MB and is unused
        // on real student devices. CI signed-smoke overrides via
        // ANDROID_ABI_FILTERS env to add x86_64 for the emulator install.
        def abiFiltersEnv = System.getenv("ANDROID_ABI_FILTERS")
        def abiList = abiFiltersEnv ? abiFiltersEnv.split(",").collect { it.trim() } : ['arm64-v8a', 'armeabi-v7a']
        ndk {
            abiFilters(*abiList)
        }
        manifestPlaceholders = [
            smokeTestBuild: System.getenv("SMOKE_TEST_BUILD") == "1" ? "true" : "false"
        ]
    }
    signingConfigs {
        release {
            def releaseStoreFile = System.getenv("RELEASE_STORE_FILE")
            def releaseStorePassword = System.getenv("RELEASE_STORE_PASSWORD")
            def releaseKeyAlias = System.getenv("RELEASE_KEY_ALIAS")
            def releaseKeyPassword = System.getenv("RELEASE_KEY_PASSWORD")
            if (releaseStoreFile && releaseStorePassword && releaseKeyAlias && releaseKeyPassword) {
                storeFile file(releaseStoreFile)
                storePassword releaseStorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
                // Sign with every scheme the target range understands. v2 alone
                // is accepted by modern Android, but some OEM installers (and
                // sideload flows) still fall back to the JAR (v1) signature and
                // report "package appears to be invalid" without it.
                enableV1Signing true
                enableV2Signing true
                enableV3Signing true
            }
        }
    }
    buildTypes {
        debug {
            // Debug builds get their OWN package id so a QA/CI debug install
            // can never collide with the production app. A debug-signed APK
            // sharing com.jsrcoaching.app makes Android reject the production
            // APK with "App not installed as package appears to be invalid"
            // (signature mismatch on the same package) — the exact symptom
            // reported on 2026-09-17. Never remove these two suffixes.
            applicationIdSuffix ".debug"
            versionNameSuffix "-debug"

            // R8 / minify is disabled for debug — AGP itself warns that a
            // debuggable build with minifyEnabled=true performs NO real
            // optimization or obfuscation ("All code optimizations and
            // obfuscation are disabled for debuggable builds"), so leaving
            // it on was pure wasted Gradle time (~20-30s) with zero benefit.
            // Release build below still ships with full R8 + proguard rules.
            minifyEnabled false
            shrinkResources false
            // PERF — debug builds don't need PNG crunching or pseudo-locale
            // generation. Skips two AGP tasks (~5-10s on cold debug builds).
            crunchPngs false
            pseudoLocalesEnabled false
            // Skip the dependency-info block — pure metadata, useless for debug.
            dependenciesInfo {
                includeInApk = false
                includeInBundle = false
            }
        }
        release {
            minifyEnabled true
            shrinkResources true
            signingConfig signingConfigs.release
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
    bundle {
        language { enableSplit = true }
        density  { enableSplit = true }
        abi      { enableSplit = true }
    }
}

// NOTE: flatDir is required so capacitor-cordova-android-plugins can resolve
// its bundled .jar / .aar libs. Gradle prints "Using flatDir should be avoided"
// — this warning is expected and SAFE to ignore. Removing this block breaks
// Cordova plugin compatibility. Do not "fix" it. (Re-verified 2026-05-22.)
repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    // EncryptedSharedPreferences for SecureStorePlugin (auth token at rest).
    implementation 'androidx.security:security-crypto:1.1.0-alpha06'
    // Razorpay Android SDK — pinned to an exact version on purpose. The old
    // capacitor-razorpay plugin used the dynamic range '1.6.+', so two builds
    // could ship different SDKs and behave differently on UPI.
    implementation 'com.razorpay:checkout:1.6.41'
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
